plugins { id 'com.android.application' version '8.13.2' }
android {
    namespace 'org.telegram.messenger'
    compileSdk 36
    defaultConfig {
        applicationId 'com.th3nekit.finegram.materialpreview'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main {
        java.srcDirs = ['../../TMessagesProj/src/main/java']
        java.includes = ['**/MaterialPalette.java', '**/MaterialSettings.java', '**/MaterialWallpaper.java', '**/MaterialStudioActivity.java']
        res.srcDirs += [layout.buildDirectory.dir('materialResources')]
    }
}
dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
tasks.register('syncMaterialResources', Copy) {
    from '../../TMessagesProj/src/main/res-finegram'
    include '**/material_studio*.xml'
    into layout.buildDirectory.dir('materialResources')
}
tasks.named('preBuild').configure { dependsOn 'syncMaterialResources' }
